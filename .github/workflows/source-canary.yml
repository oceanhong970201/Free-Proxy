name: source-canary

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-canary:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_CANARY: '1'
      PYTHONPATH: src
      CLASH_SPEEDTEST_VERSION: 'v1.8.8-mihomo-v1.19.29-gvisor'
    steps:
      - name: Checkout registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore canary history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/source-canary-history.jsonl
          key: source-canary-history-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-canary-history-v2-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Cache clash-speedtest binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: clash-speedtest-v1.8.8-mihomo-v1.19.29-gvisor-r1-${{ runner.os }}-${{ runner.arch }}-go1.26.5

      - name: Install clash-speedtest
        run: bash tools/install-clash-speedtest-openvpn.sh

      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt

      - name: Check read-only baseline
        run: test -s output/singbox.json

      - name: Run candidate audit and canary
        id: audit
        continue-on-error: true
        run: >-
          python src/aggregator/cli.py audit-sources
          --round 1
          --verify
          --max-runtime 900
          --baseline output/singbox.json
          --history state/source-canary-history.jsonl

      - name: Check audit report
        if: always()
        run: |
          test -s state/source-audit.json

      - name: Materialize per-candidate artifacts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("state/source-audit.json")
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              artifact_dir = Path("state/source-canary-artifacts")
              artifact_dir.mkdir(parents=True, exist_ok=True)
              shared = {
                  "run_id": report.get("run_id"),
                  "generated_at": report.get("generated_at"),
                  "baseline": report.get("baseline"),
                  "gate_config": report.get("gate_config"),
              }
              for result in report.get("results", []):
                  candidate_id = str(result.get("id") or "unknown")
                  payload = dict(shared)
                  payload["result"] = result
                  (artifact_dir / f"{candidate_id}.json").write_text(
                      json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
          PY

      - name: Save canary history
        if: always() && hashFiles('state/source-canary-history.jsonl') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/source-canary-history.jsonl
          key: source-canary-history-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload source audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/source-audit.json
            state/source-canary-history.jsonl
            state/source-canary-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce canary gate
        if: steps.audit.outcome == 'failure'
        run: exit 1
